# Site settings
locale: "en-US"
title: "MAHI Lab"
title_separator: "-"
subtitle: "Machine-and-Human Intelligence Lab"
name: "MAHI Lab"
description: "Machine-and-Human Intelligence Lab, Department of Computer Science, BITS Pilani, K K Birla Goa Campus."
url: "https://mahi-group.github.io"
baseurl: ""
repository: "MAHI-Group/mahi-group.github.io"
logo: "/images/cg_gen2.png"
words_per_minute: 160

# Theme (default, air, sunrise, mint, dirt, contrast); each has light + dark, chosen by visitor OS
site_theme: "sunrise"

comments:
  provider: false

# Sidebar author profile.
author:
  name: #"MAHI Lab"
  avatar: "cg_gen2.png"
  bio: "ā no bhadrāḥ kratavo yantu viśvataḥ — let noble thoughts come to us from every side."
  PI: "<a href='https://tirtharajdash.github.io'>Tirtharaj Dash</a>"
  location: "<a href='https://www.bits-pilani.ac.in/goa/'>BITS Pilani, Goa Campus</a>"  
  email: "tirtharaj@goa.bits-pilani.ac.in"
  github: "MAHI-Group"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/MAHI-Group"

# Reading files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - README
  - tmp
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Kolkata

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-redirect-from

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: false
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

paginate: 5
paginate_path: /page:num/
