{% include base_path %}

<!-- start custom head snippets -->

<!-- Tagline font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital@0;1&display=swap" rel="stylesheet">

<style>
  html { font-size: 16px !important; }
  @media (min-width: 48em) { html { font-size: 16px !important; } }
  @media (min-width: 64em) { html { font-size: 17px !important; } }
  @media (min-width: 80em) { html { font-size: 18px !important; } }

  .site-logo img { max-height: 2.8rem; }

  /* Sidebar: rounded-tile logo, stacked, kept inside its own column with a gutter */
  .sidebar {
    padding-right: 1.5em !important;
    box-sizing: border-box !important;
  }
  .author__avatar,
  .author__content {
    display: block !important;
    float: none !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  .author__content {
    padding-left: 0 !important;
    overflow-wrap: break-word !important;
  }
  .author__avatar { text-align: center; margin-bottom: 0.5rem; }
  .author__avatar img {
    background: #ffffff !important;
    border: 1px solid rgba(0,0,0,0.08) !important;
    border-radius: 16px !important;
    padding: 8px !important;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08) !important;
    box-sizing: border-box !important;
    max-width: min(180px, 100%) !important;
    height: auto !important;
  }

  /* Tagline styling */
  .author__bio {
    font-family: "Gentium Book Plus", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.45;
  }

  /* Center content (sidebar + main), equal margins both sides */
  .masthead__inner-wrap,
  #main,
  .page__footer footer {
    max-width: 1140px !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  /* Symmetric right gutter on the article */
  .page { padding-right: 2em !important; }

  .author__desktop a {
    display: inline !important;
  }

  /* Slimmer footer band */
  .page__footer footer {
    margin-top: 0.3em !important;
    padding: 0.5em 1em 0.5em !important;
  }
  .page__footer-follow li {
    padding-top: 2px !important;
    padding-bottom: 2px !important;
  }
</style>

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
