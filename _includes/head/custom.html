{% include base_path %}

<!-- start custom head snippets -->

<style>
  html { font-size: 16px !important; }
  @media (min-width: 48em) { html { font-size: 16px !important; } }
  @media (min-width: 64em) { html { font-size: 17px !important; } }
  @media (min-width: 80em) { html { font-size: 18px !important; } }

  .site-logo img { max-height: 2.8rem; }

  .author__avatar,
  .author__content {
    display: block !important;
    float: none !important;
    width: auto !important;
  }
  .author__avatar { text-align: center; margin-bottom: 0.5rem; }
  .author__avatar img {
    border-radius: 0 !important;
    border: 0 !important;
    padding: 0 !important;
    box-shadow: none !important;
    max-width: 180px !important;
    height: auto !important;
  }
  .author__content { padding-left: 0 !important; }
  
  /* Center content (sidebar + main) like the personal site, equal margins both sides */
  .masthead__inner-wrap,
  #main,
  .page__footer footer {
    max-width: 1140px !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  .page { padding-right: 2em !important; }
</style>

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
